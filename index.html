                                onClick={() => { setEditingTypeIdx(idx); setEditingTypeVal(tName); }}
                                className="p-1.5 text-slate-400 hover:text-blue-600 rounded-lg hover:bg-blue-50 dark:hover:bg-slate-800"
                                title="Rename"
                              >
                                <Icon name="Edit3" className="w-3.5 h-3.5" />
                              </button>
                              <button
                                onClick={() => handleRemoveTaskType(idx)}
                                className="p-1.5 text-slate-400 hover:text-red-500 rounded-lg hover:bg-red-50 dark:hover:bg-slate-800"
                                title="Remove"
                              >
                                <Icon name="Trash2" className="w-3.5 h-3.5" />
                              </button>
                            </div>
                          </>
                        )}
                      </div>
                    ))}
                  </div>
                </div>

                <div className="pt-4 border-t border-slate-200 dark:border-slate-700">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">2. Auto-Strip Prefix Rules</h4>
                  <p className="text-[11px] text-slate-500 dark:text-slate-400 mb-2.5">
                    Text matching these prefixes at the start of pasted tickets will be removed automatically.
                  </p>
                  <form onSubmit={handleAddPrefixRule} className="flex gap-2 mb-3">
                    <input
                      type="text"
                      value={newPrefixRule}
                      onChange={(e) => setNewPrefixRule(e.target.value)}
                      placeholder="e.g. Claim ID: or Ref#"
                      className="flex-1 text-xs px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-blue-500"
                    />
                    <button
                      type="submit"
                      className="px-3.5 py-2 bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 text-white text-xs font-semibold rounded-xl transition-colors"
                    >
                      Add Rule
                    </button>
                  </form>
                  <div className="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto">
                    {prefixRules.map((rule, idx) => (
                      <span
                        key={`${rule}-${idx}`}
                        className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-100 dark:bg-slate-900 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700"
                      >
                        <span>{rule}</span>
                        <button
                          type="button"
                          onClick={() => handleRemovePrefixRule(idx)}
                          className="text-slate-400 hover:text-red-500"
                          title="Remove rule"
                        >
                          <Icon name="X" className="w-3 h-3" />
                        </button>
                      </span>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* POPUP MODAL FOR DIFFERENT-DATE DUPLICATE CONFIRMATION */}
          {duplicateConfirmData && (
            <div className="fixed inset-0 z-[80] flex items-center justify-center bg-slate-900/65 backdrop-blur-sm p-4">
              <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-amber-300 dark:border-amber-600/60 p-6 sm:p-7 max-w-md w-full text-center">
                <div className="w-12 h-12 rounded-2xl bg-amber-100 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400 flex items-center justify-center mx-auto mb-4">
                  <Icon name="AlertCircle" className="w-6 h-6" />
                </div>
                <h3 className="text-lg font-bold text-slate-800 dark:text-white mb-2">Previous Date Duplicate Found</h3>
                <p className="text-sm text-slate-600 dark:text-slate-300 mb-4 leading-relaxed">
                  Ticket <span className="font-bold text-slate-900 dark:text-white">{duplicateConfirmData.ticketNo}</span> was already logged on <span className="font-semibold text-amber-600 dark:text-amber-400">{duplicateConfirmData.previousDate}</span> ({duplicateConfirmData.previousType}).<br />
                  Do you want to log it again on <span className="font-bold text-slate-900 dark:text-white">{dashboardDate}</span>?
                </p>
                <div className="flex items-center justify-center gap-2 mb-5">
                  <span className="text-sm font-medium text-slate-600 dark:text-slate-300">Select Type:</span>
                  <select
                    value={duplicateConfirmData.selectedType}
                    onChange={(e) => setDuplicateConfirmData({ ...duplicateConfirmData, selectedType: e.target.value })}
                    className="px-3 py-1.5 text-sm font-bold rounded-xl border border-blue-200 dark:border-slate-600 bg-blue-50 dark:bg-slate-900 text-blue-700 dark:text-blue-400 outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer transition-colors"
                  >
                    {taskTypes.map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                </div>
                <div className="flex gap-3">
                  <button
                    onClick={() => {
                      setDuplicateConfirmData(null);
                      setQuickTicketNo('');
                      setQuickNote('');
                      setToast({ message: 'Duplicate entry rejected.', type: 'error' });
                      setTimeout(() => quickInputRef.current?.focus(), 50);
                    }}
                    className="flex-1 py-2.5 px-4 rounded-xl border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-300 font-semibold text-sm hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors flex items-center justify-center gap-1.5"
                    title="Press ESC to reject"
                  >
                    Reject <kbd className="text-[10px] bg-slate-100 dark:bg-slate-800 border px-1 rounded text-slate-500">ESC</kbd>
                  </button>
                  <button
                    onClick={() => commitTicketEntry(duplicateConfirmData.ticketNo, duplicateConfirmData.selectedType, duplicateConfirmData.note || '', false, duplicateConfirmData.flagged)}
                    className="flex-1 py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm shadow-xs transition-colors flex items-center justify-center gap-1.5"
                    title="Press Enter to confirm"
                  >
                    Confirm & Log <kbd className="text-[10px] bg-blue-500/50 border border-blue-400 px-1 rounded text-blue-100">ENTER</kbd>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* POPUP MODAL FOR DATE-RANGE REPORT SUMMARY */}
          {showRangePopup && (
            <div className="fixed inset-0 z-[90] flex items-center justify-center bg-slate-900/65 backdrop-blur-sm p-4 overflow-y-auto">
              <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700 p-6 sm:p-8 max-w-4xl w-full relative my-8">
                <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-4 mb-6 pr-10">
                  <div>
                    <h3 className="text-2xl font-bold text-slate-800 dark:text-white">Work Report Summary</h3>
                    <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">
                      From <span className="font-semibold text-blue-600 dark:text-blue-400">{fromDate}</span> to <span className="font-semibold text-blue-600 dark:text-blue-400">{toDate || getTodayISO()}</span> — Total: <span className="font-bold text-slate-800 dark:text-white">{rangeTickets.length} Tickets</span>
                    </p>
                  </div>

                  {rangeTickets.length > 0 && (
                    <div className="flex items-center gap-2.5 shrink-0">
                      <button
                        onClick={handleCopyRangeSpreadsheet}
                        className="flex items-center px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl transition-colors shadow-xs"
                      >
                        <Icon name="Copy" className="w-3.5 h-3.5 mr-1.5" />
                        Copy Sheet
                      </button>
                      <button
                        onClick={handleDownloadRangeCSV}
                        className="flex items-center px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl transition-colors shadow-xs"
                      >
                        <Icon name="Download" className="w-3.5 h-3.5 mr-1.5" />
                        Download CSV
                      </button>
                    </div>
                  )}
                </div>

                <button 
                  onClick={() => setShowRangePopup(false)} 
                  className="absolute top-5 right-5 p-2 text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors"
                >
                  <Icon name="X" className="w-5 h-5" />
                </button>

                {rangeTickets.length > 0 ? (
                  <div className="space-y-6 max-h-[75vh] overflow-y-auto pr-1">
                    <div>
                      <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">1. Count by Work Type (Spreadsheet View)</h4>
                      <div className="border border-slate-300 dark:border-slate-600 rounded-xl overflow-hidden">
                        <table className="w-full text-left border-collapse text-sm">
                          <thead>
                            <tr className="bg-slate-100 dark:bg-slate-900 text-slate-700 dark:text-slate-300 text-xs uppercase border-b border-slate-300 dark:border-slate-600">
                              <th className="px-4 py-2.5 font-bold border-r border-slate-300 dark:border-slate-600 w-16 text-center">#</th>
                              <th className="px-4 py-2.5 font-bold border-r border-slate-300 dark:border-slate-600">Work Type</th>
                              <th className="px-4 py-2.5 font-bold text-right w-32">Total Count</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-200 dark:divide-slate-700 text-slate-800 dark:text-slate-200">
                            {rangeStatsByType.map((item, idx) => (
                              <tr key={item.name} className="even:bg-slate-50/70 dark:even:bg-slate-800/60">
                                <td className="px-4 py-2 font-mono text-xs text-slate-500 text-center border-r border-slate-200 dark:border-slate-700">{idx + 1}</td>
                                <td className="px-4 py-2 font-semibold border-r border-slate-200 dark:border-slate-700">{item.name}</td>
                                <td className="px-4 py-2 font-bold text-right text-blue-600 dark:text-blue-400">{item.count}</td>
                              </tr>
                            ))}
                            <tr className="bg-blue-50/70 dark:bg-blue-900/20 font-bold border-t-2 border-slate-300 dark:border-slate-600">
                              <td colSpan="2" className="px-4 py-2.5 text-right uppercase text-xs tracking-wider text-slate-600 dark:text-slate-300 border-r border-slate-200 dark:border-slate-700">
                                Grand Total
                              </td>
                              <td className="px-4 py-2.5 text-right text-blue-700 dark:text-blue-300">
                                {rangeTickets.length}
                              </td>
                            </tr>
                          </tbody>
                        </table>
                      </div>
                    </div>

                    <div className="bg-slate-50 dark:bg-slate-900/60 p-5 rounded-2xl border border-slate-200 dark:border-slate-700">
                      <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4">2. Visual Chart</h4>
                      <div className="h-80 w-full">
                        <ResponsiveContainer width="100%" height="100%">
                          <BarChart data={rangeStatsByType} margin={{ top: 10, right: 20, left: -10, bottom: 5 }}>
                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke={theme === 'dark' ? '#334155' : '#e2e8f0'} />
                            <XAxis dataKey="name" axisLine={false} tickLine={false} tick={(props) => <text x={props.x} y={props.y} dy={16} textAnchor="middle" fill={theme === 'dark' ? '#94a3b8' : '#64748b'} fontSize={12}>{props.payload.value}</text>} />
                            <YAxis axisLine={false} tickLine={false} tick={(props) => <text x={props.x} y={props.y} dx={-12} textAnchor="end" fill={theme === 'dark' ? '#94a3b8' : '#64748b'} fontSize={12}>{props.payload.value}</text>} allowDecimals={false} />
                            <RechartsTooltip 
                              cursor={false}
                              contentStyle={{borderRadius: '12px', border: 'none', backgroundColor: theme === 'dark' ? '#1e293b' : '#fff', color: theme === 'dark' ? '#fff' : '#000', boxShadow: '0 4px 12px rgba(0,0,0,0.1)'}} 
                            />
                            <Bar dataKey="count" name="Tickets" radius={[8, 8, 0, 0]} maxBarSize={64}>
                              {rangeStatsByType.map((entry, index) => (
                                <Cell key={`range-cell-${index}`} fill={entry.color} />
                              ))}
                            </Bar>
                          </BarChart>
                        </ResponsiveContainer>
                      </div>
                    </div>

                    <div className="space-y-5">
                      <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400">3. Serialized Tickets by Work Type ({rangeTickets.length})</h4>
                      {rangeStatsByType.map((stat) => {
                        const typeTickets = rangeTickets.filter((t) => t.type === stat.name);
                        return (
                          <div key={stat.name} className="border border-slate-300 dark:border-slate-600 rounded-xl overflow-hidden">
                            <div className="bg-slate-200/80 dark:bg-slate-900 px-4 py-2 border-b border-slate-300 dark:border-slate-600 flex items-center justify-between">
                              <span className="text-xs font-bold uppercase tracking-wider text-slate-800 dark:text-white flex items-center">
                                <span className="w-2.5 h-2.5 rounded-full mr-2" style={{ backgroundColor: stat.color }}></span>
                                {stat.name}
                              </span>
                              <span className="text-xs font-bold px-2 py-0.5 rounded-md bg-white dark:bg-slate-800 text-blue-600 dark:text-blue-400">
                                Total: {typeTickets.length}
                              </span>
                            </div>
                            <table className="w-full text-left border-collapse text-sm">
                              <thead>
                                <tr className="bg-slate-100 dark:bg-slate-900/60 text-slate-700 dark:text-slate-300 text-xs uppercase border-b border-slate-300 dark:border-slate-600">
                                  <th className="px-4 py-2 font-bold w-16 text-center border-r border-slate-300 dark:border-slate-600">SL</th>
                                  <th className="px-4 py-2 font-bold border-r border-slate-300 dark:border-slate-600">Ticket Number</th>
                                  <th className="px-4 py-2 font-bold border-r border-slate-300 dark:border-slate-600 w-36">Work Type</th>
                                  <th className="px-4 py-2 font-bold text-right">Date & Time</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-200 dark:divide-slate-700 text-slate-800 dark:text-slate-200">
                                {typeTickets.map((t, index) => (
                                  <tr key={t.id} className="even:bg-slate-50/70 dark:even:bg-slate-800/60 hover:bg-blue-50/40 dark:hover:bg-slate-700/40">
                                    <td className="px-4 py-2 font-mono text-xs text-slate-500 text-center border-r border-slate-200 dark:border-slate-700">{index + 1}</td>
                                    <td className="px-4 py-2 font-bold border-r border-slate-200 dark:border-slate-700">{cleanTicketText(t.ticketNo)}</td>
                                    <td className="px-4 py-2 border-r border-slate-200 dark:border-slate-700">
                                      <span className="text-xs font-semibold px-2 py-0.5 rounded-md bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400">
                                        {t.type}
                                      </span>
                                    </td>
                                    <td className="px-4 py-2 text-right font-mono text-xs text-slate-500 dark:text-slate-400">{t.timestamp}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ) : (
                  <div className="py-12 text-center text-slate-400">
                    <Icon name="Activity" className="w-12 h-12 mx-auto mb-3 opacity-20" />
                    <p className="text-sm">No tickets found from {fromDate} to {toDate || getTodayISO()}.</p>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Toast Notification Component Call */}
          {toast && (
            <Toast 
              message={toast.message} 
              type={toast.type} 
              onClose={() => setToast(null)} 
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
