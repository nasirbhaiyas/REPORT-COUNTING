<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nasir TicketFlow</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel (for JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- PropTypes & Recharts -->
  <script src="https://unpkg.com/prop-types@15.7.2/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #root { min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Elegant Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }

    /* Neon Glowing Input Effect */
    @keyframes neon-pulse {
      0%, 100% {
        box-shadow: 0 0 8px rgba(59, 130, 246, 0.6), 0 0 15px rgba(59, 130, 246, 0.3), inset 0 0 8px rgba(59, 130, 246, 0.2);
        border-color: rgba(96, 165, 250, 0.8);
      }
      50% {
        box-shadow: 0 0 15px rgba(59, 130, 246, 0.9), 0 0 25px rgba(59, 130, 246, 0.6), inset 0 0 12px rgba(59, 130, 246, 0.4);
        border-color: rgba(147, 197, 253, 1);
      }
    }
    .neon-glow {
      animation: neon-pulse 2s infinite alternate;
      border-style: solid !important;
    }
    .neon-glow:focus {
      animation: none;
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.9), 0 0 30px rgba(34, 211, 238, 0.6), inset 0 0 15px rgba(34, 211, 238, 0.5);
      border-color: rgba(34, 211, 238, 1) !important;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-blue-50/30 to-indigo-50/40 dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950/30 text-slate-900 dark:text-slate-100 transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useLayoutEffect, useCallback } = React;
    const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell } = window.Recharts;

    // --- Universal Icon Component for CDN Usage ---
    const Icon = ({ name, className = "", onClick, title, style }) => {
      const spanRef = useRef(null);
      
      useLayoutEffect(() => {
        if (spanRef.current && window.lucide && window.lucide.icons[name]) {
          spanRef.current.innerHTML = '';
          const svg = window.lucide.createElement(window.lucide.icons[name]);
          if (className) svg.setAttribute('class', className);
          if (title) {
            const t = document.createElementNS('http://www.w3.org/2000/svg', 'title');
            t.textContent = title;
            svg.appendChild(t);
          }
          spanRef.current.appendChild(svg);
        }
      }, [name, className, title]);

      return (
        <span 
          ref={spanRef} 
          onClick={onClick} 
          style={style}
          className={`inline-flex shrink-0 justify-center items-center ${onClick ? 'cursor-pointer' : ''}`} 
        />
      );
    };

    // --- Theme & Colors ---
    const COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316', '#6366f1', '#06b6d4'];
    const STATUSES = ['Pending', 'In Progress', 'Completed', 'Cancelled'];
    const DEFAULT_TASK_TYPES = ['Appeal', 'Claim Review', 'Follow Up', 'TDI', 'IDR', 'Complaint', 'NSA', 'Final Review'];
    const DEFAULT_PREFIX_RULES = ['F Patient Account Number', 'Patient Account Number', 'Account Number', 'Claim ID:', 'Ticket #', 'Ref#'];

    const COLOR_PALETTE_STYLES = [
      { badge: 'bg-blue-600 text-white border-blue-600', card: 'border-blue-200 bg-blue-50/70 hover:bg-blue-100/80 dark:border-blue-800 dark:bg-blue-950/40 dark:hover:bg-blue-900/60', text: 'text-blue-800 dark:text-blue-200' },
      { badge: 'bg-emerald-600 text-white border-emerald-600', card: 'border-emerald-200 bg-emerald-50/70 hover:bg-emerald-100/80 dark:border-emerald-800 dark:bg-emerald-950/40 dark:hover:bg-emerald-900/60', text: 'text-emerald-800 dark:text-emerald-200' },
      { badge: 'bg-amber-50 text-white border-amber-500', card: 'border-amber-200 bg-amber-50/70 hover:bg-amber-100/80 dark:border-amber-800 dark:bg-amber-950/40 dark:hover:bg-amber-900/60', text: 'text-amber-800 dark:text-amber-200' },
      { badge: 'bg-rose-600 text-white border-rose-600', card: 'border-rose-200 bg-rose-50/70 hover:bg-rose-100/80 dark:border-rose-800 dark:bg-rose-950/40 dark:hover:bg-rose-900/60', text: 'text-rose-800 dark:text-rose-200' },
      { badge: 'bg-purple-600 text-white border-purple-600', card: 'border-purple-200 bg-purple-50/70 hover:bg-purple-100/80 dark:border-purple-800 dark:bg-purple-950/40 dark:hover:bg-purple-900/60', text: 'text-purple-800 dark:text-purple-200' },
      { badge: 'bg-pink-600 text-white border-pink-600', card: 'border-pink-200 bg-pink-50/70 hover:bg-pink-100/80 dark:border-pink-800 dark:bg-pink-950/40 dark:hover:bg-pink-900/60', text: 'text-pink-800 dark:text-pink-200' },
      { badge: 'bg-teal-600 text-white border-teal-600', card: 'border-teal-200 bg-teal-50/70 hover:bg-teal-100/80 dark:border-teal-800 dark:bg-teal-950/40 dark:hover:bg-teal-900/60', text: 'text-teal-800 dark:text-teal-200' },
      { badge: 'bg-orange-600 text-white border-orange-600', card: 'border-orange-200 bg-orange-50/70 hover:bg-orange-100/80 dark:border-orange-800 dark:bg-orange-950/40 dark:hover:bg-orange-900/60', text: 'text-orange-800 dark:text-orange-200' }
    ];

    const getTypeStyle = (index) => COLOR_PALETTE_STYLES[index % COLOR_PALETTE_STYLES.length];

    // --- Shared AudioContext for Zero-Latency Sound Feedback ---
    let sharedAudioCtx = null;
    const getAudioCtx = () => {
      if (!sharedAudioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) sharedAudioCtx = new AudioCtx();
      }
      if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume().catch(() => {});
      }
      return sharedAudioCtx;
    };

    const playFeedbackTone = (type, enabled, pack = 'minimalist') => {
      if (!enabled) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (pack === 'arcade') {
          if (type === 'success') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.06);
            osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.22);
          } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.25);
          }
        } else if (pack === 'scifi') {
          if (type === 'success') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.16);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.18);
          } else {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(420, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.22);
            gain.gain.setValueAtTime(0.14, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.24);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.24);
          }
        } else {
          if (type === 'success') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(620, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(940, ctx.currentTime + 0.11);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.14);
          } else {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(240, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(170, ctx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.2);
          }
        }
      } catch {}
    };

    const cleanTicketText = (raw, customPrefixes = DEFAULT_PREFIX_RULES) => {
      if (!raw) return '';
      let cleaned = String(raw)
        .replace(/^F\s*Patient\s*Account\s*Number\s*[:#-]?\s*/i, '')
        .replace(/^Patient\s*Account\s*Number\s*[:#-]?\s*/i, '')
        .replace(/^Account\s*Number\s*[:#-]?\s*/i, '')
        .trim();

      if (Array.isArray(customPrefixes)) {
        customPrefixes.forEach((prefix) => {
          const p = (prefix || '').trim();
          if (!p) return;
          const escaped = p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const regex = new RegExp(`^${escaped}\\s*[:#-]?\\s*`, 'i');
          cleaned = cleaned.replace(regex, '').trim();
        });
      }
      return cleaned;
    };

    const extractBulkTickets = (rawText, customPrefixes = DEFAULT_PREFIX_RULES) => {
      if (!rawText) return [];
      const lines = rawText.split(/[\r\n,;]+/);
      const tokens = [];
      lines.forEach((line) => {
        const cleanedLine = cleanTicketText(line, customPrefixes);
        if (!cleanedLine) return;
        const parts = cleanedLine.split(/\s+/).map(p => cleanTicketText(p, customPrefixes)).filter(Boolean);
        parts.forEach(p => tokens.push(p));
      });
      return Array.from(new Set(tokens));
    };

    const getTodayISO = () => {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    };

    const getTicketISO = (t) => {
      if (t.isoDate) return t.isoDate;
      if (t.timestamp && t.timestamp.includes(' - ')) {
        const datePart = t.timestamp.split(' - ')[1];
        const parsed = new Date(datePart);
        if (!isNaN(parsed.getTime())) {
          const y = parsed.getFullYear();
          const m = String(parsed.getMonth() + 1).padStart(2, '0');
          const d = String(parsed.getDate()).padStart(2, '0');
          return `${y}-${m}-${d}`;
        }
      }
      return getTodayISO();
    };

    // --- Toast Notification Component ---
    const Toast = ({ message, type, onClose }) => {
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        const enterTimer = setTimeout(() => setVisible(true), 10);
        const exitTimer = setTimeout(() => {
          setVisible(false);
          setTimeout(onClose, 300);
        }, 2600);
        return () => {
          clearTimeout(enterTimer);
          clearTimeout(exitTimer);
        };
      }, [message, onClose]);

      const bgColor = type === 'success' 
        ? 'bg-emerald-600/95 border-emerald-400 text-white shadow-emerald-500/25' 
        : 'bg-red-600/95 border-red-400 text-white shadow-red-500/25';
      const iconName = type === 'success' ? 'Check' : 'AlertCircle';

      return (
        <div 
          className={`fixed top-5 left-1/2 -translate-x-1/2 flex items-center px-5 py-3 border rounded-full shadow-2xl backdrop-blur-md ${bgColor} transition-all duration-300 ease-out z-[9999] ${
            visible ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 -translate-y-6 scale-95 pointer-events-none'
          }`}
        >
          <Icon name={iconName} className="w-4 h-4 mr-2.5 shrink-0" />
          <span className="font-semibold text-sm tracking-wide whitespace-nowrap">{message}</span>
          <button 
            onClick={() => { setVisible(false); setTimeout(onClose, 250); }} 
            className="ml-3 opacity-80 hover:opacity-100 transition-opacity"
          >
            <Icon name="X" className="w-4 h-4" />
          </button>
        </div>
      );
    };

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [toast, setToast] = useState(null);
      const quickInputRef = useRef(null);
      const keyBuffer = useRef(''); 
      const [showUndoBtn, setShowUndoBtn] = useState(false);
      
      // --- Zen / Focus Mode ---
      const [zenMode, setZenMode] = useState(false);
      
      // --- Secret Master Tools Page ---
      const [showSecretPage, setShowSecretPage] = useState(false);
      
      // Multi-Note State
      const [secretNotes, setSecretNotes] = useState(() => {
        try {
          const saved = localStorage.getItem('taskTrackerSecretNotes');
          if (saved) return JSON.parse(saved);
          
          // Migration from old single string note
          const oldNote = localStorage.getItem('taskTrackerSecretNote');
          if (oldNote) {
            return [{ id: Date.now().toString(), title: 'Migrated Note', content: oldNote }];
          }
          return [{ id: Date.now().toString(), title: 'New Note', content: '' }];
        } catch { 
          return [{ id: Date.now().toString(), title: 'New Note', content: '' }]; 
        }
      });
      const [activeNoteId, setActiveNoteId] = useState(secretNotes[0]?.id || null);

      const [secretBulkInput, setSecretBulkInput] = useState('');
      const [secretBulkType, setSecretBulkType] = useState('Appeal');
      const [secretBulkCustomNote, setSecretBulkCustomNote] = useState('');
      const fileInputRef = useRef(null);

      useEffect(() => {
        try { localStorage.setItem('taskTrackerSecretNotes', JSON.stringify(secretNotes)); } catch {}
      }, [secretNotes]);

      const updateActiveSecretNote = (field, value) => {
        setSecretNotes(prev => prev.map(note => 
          note.id === activeNoteId ? { ...note, [field]: value } : note
        ));
      };

      const handleCreateSecretNote = () => {
        const newNote = { id: Date.now().toString(), title: 'New Note', content: '' };
        setSecretNotes(prev => [newNote, ...prev]);
        setActiveNoteId(newNote.id);
      };

      const handleDeleteSecretNote = (id) => {
        const updated = secretNotes.filter(n => n.id !== id);
        setSecretNotes(updated.length > 0 ? updated : [{ id: Date.now().toString(), title: 'New Note', content: '' }]);
        if (activeNoteId === id) {
          setActiveNoteId(updated.length > 0 ? updated[0].id : null);
        }
      };

      const handleDownloadSecretNote = () => {
        const activeNote = secretNotes.find(n => n.id === activeNoteId);
        if (!activeNote || !activeNote.content.trim()) {
          setToast({ message: 'Note is empty, nothing to download.', type: 'error' });
          return;
        }
        const blob = new Blob([activeNote.content], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        const safeTitle = (activeNote.title || 'Secret_Note').replace(/[^a-z0-9_-]/gi, '_');
        link.setAttribute('download', `${safeTitle}.txt`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setToast({ message: 'Note downloaded as TXT!', type: 'success' });
      };

      // --- Compact / Relaxed Table View ---
      const [compactView, setCompactView] = useState(() => {
        try { return localStorage.getItem('taskTrackerCompact') === 'true'; }
        catch { return false; }
      });

      useEffect(() => {
        try { localStorage.setItem('taskTrackerCompact', String(compactView)); } catch {}
      }, [compactView]);

      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem('taskTrackerTheme') || 'light'; } 
        catch { return 'light'; }
      });

      const [soundEnabled, setSoundEnabled] = useState(() => {
        try {
          const saved = localStorage.getItem('taskTrackerSound');
          return saved === null ? true : saved === 'true';
        } catch { return true; }
      });

      const [soundPack, setSoundPack] = useState(() => {
        try { return localStorage.getItem('taskTrackerSoundPack') || 'minimalist'; }
        catch { return 'minimalist'; }
      });

      useEffect(() => {
        try { localStorage.setItem('taskTrackerSound', String(soundEnabled)); } catch {}
      }, [soundEnabled]);

      useEffect(() => {
        try { localStorage.setItem('taskTrackerSoundPack', soundPack); } catch {}
      }, [soundPack]);

      const [taskTypes, setTaskTypes] = useState(() => {
        try {
          const saved = localStorage.getItem('taskTrackerCustomTypes');
          const parsed = saved ? JSON.parse(saved) : null;
          return Array.isArray(parsed) && parsed.length > 0 ? parsed : DEFAULT_TASK_TYPES;
        } catch { return DEFAULT_TASK_TYPES; }
      });
      
      const [showTypeManager, setShowTypeManager] = useState(false);
      const [newTypeName, setNewTypeName] = useState('');
      const [editingTypeIdx, setEditingTypeIdx] = useState(null);
      const [editingTypeVal, setEditingTypeVal] = useState('');

      const [prefixRules, setPrefixRules] = useState(() => {
        try {
          const saved = localStorage.getItem('taskTrackerPrefixRules');
          const parsed = saved ? JSON.parse(saved) : null;
          return Array.isArray(parsed) ? parsed : DEFAULT_PREFIX_RULES;
        } catch { return DEFAULT_PREFIX_RULES; }
      });
      const [newPrefixRule, setNewPrefixRule] = useState('');

      useEffect(() => {
        try { localStorage.setItem('taskTrackerPrefixRules', JSON.stringify(prefixRules)); } catch {}
      }, [prefixRules]);

      useEffect(() => {
        try { localStorage.setItem('taskTrackerCustomTypes', JSON.stringify(taskTypes)); } catch {}
      }, [taskTypes]);

      const [dailyTarget, setDailyTarget] = useState(() => {
        try {
          const saved = parseInt(localStorage.getItem('taskTrackerDailyTarget'), 10);
          return !isNaN(saved) && saved > 0 ? saved : 50;
        } catch { return 50; }
      });
      const [weeklyTarget, setWeeklyTarget] = useState(() => {
        try {
          const saved = parseInt(localStorage.getItem('taskTrackerWeeklyTarget'), 10);
          return !isNaN(saved) && saved > 0 ? saved : 250;
        } catch { return 250; }
      });
      const [monthlyTarget, setMonthlyTarget] = useState(() => {
        try {
          const saved = parseInt(localStorage.getItem('taskTrackerMonthlyTarget'), 10);
          return !isNaN(saved) && saved > 0 ? saved : 1000;
        } catch { return 1000; }
      });

      const [isEditingTarget, setIsEditingTarget] = useState(false);
      const [targetDraft, setTargetDraft] = useState(String(dailyTarget));

      useEffect(() => {
        try { localStorage.setItem('taskTrackerDailyTarget', String(dailyTarget)); } catch {}
      }, [dailyTarget]);
      useEffect(() => {
        try { localStorage.setItem('taskTrackerWeeklyTarget', String(weeklyTarget)); } catch {}
      }, [weeklyTarget]);
      useEffect(() => {
        try { localStorage.setItem('taskTrackerMonthlyTarget', String(monthlyTarget)); } catch {}
      }, [monthlyTarget]);

      const [tickets, setTickets] = useState(() => {
        try {
          const saved = localStorage.getItem('taskTrackerTickets');
          return saved ? JSON.parse(saved) : [];
        } catch { return []; }
      });

      const [trashedTickets, setTrashedTickets] = useState(() => {
        try {
          const saved = localStorage.getItem('taskTrackerTrash');
          const parsed = saved ? JSON.parse(saved) : [];
          const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
          const now = Date.now();
          return Array.isArray(parsed) ? parsed.filter(item => !item.deletedAt || (now - item.deletedAt) < thirtyDaysMs) : [];
        } catch { return []; }
      });

      useEffect(() => {
        try { localStorage.setItem('taskTrackerTickets', JSON.stringify(tickets)); } catch (e) {}
      }, [tickets]);

      useEffect(() => {
        try { localStorage.setItem('taskTrackerTrash', JSON.stringify(trashedTickets)); } catch (e) {}
      }, [trashedTickets]);

      // 30-Second Auto-Hide Timer for Undo Button
      useEffect(() => {
        if (tickets.length > 0) {
          setShowUndoBtn(true);
          const timer = setTimeout(() => {
            setShowUndoBtn(false);
          }, 30000);
          return () => clearTimeout(timer);
        } else {
          setShowUndoBtn(false);
        }
      }, [tickets]);

      useEffect(() => {
        try { localStorage.setItem('taskTrackerTheme', theme); } catch (e) {}
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [theme]);

      const [quickTicketNo, setQuickTicketNo] = useState('');
      const [quickNote, setQuickNote] = useState('');
      const [quickFlagged, setQuickFlagged] = useState(false);
      const [showQuickPopup, setShowQuickPopup] = useState(false);
      const [bulkQueue, setBulkQueue] = useState([]);
      const [duplicateConfirmData, setDuplicateConfirmData] = useState(null);
      const [lastUsedType, setLastUsedType] = useState(() => {
        try { return localStorage.getItem('lastUsedTaskType') || 'Appeal'; } 
        catch { return 'Appeal'; }
      });

      const [draggedTicket, setDraggedTicket] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      const [filterType, setFilterType] = useState('All');
      const [onlyFlagged, setOnlyFlagged] = useState(false);
      const [editingNoteId, setEditingNoteId] = useState(null);
      const [editingNoteDraft, setEditingNoteDraft] = useState('');
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);
      const [selectedIds, setSelectedIds] = useState([]);
      const [bulkActionType, setBulkActionType] = useState('');

      const [bulkCountdown, setBulkCountdown] = useState(null);
      const bulkTimerRef = useRef(null);

      useEffect(() => {
        if (!showQuickPopup && bulkTimerRef.current) {
          clearInterval(bulkTimerRef.current);
          setBulkCountdown(null);
        }
      }, [showQuickPopup]);

      const [dashboardDate, setDashboardDate] = useState(() => getTodayISO());
      const [fromDate, setFromDate] = useState(() => {
        const d = new Date();
        d.setDate(d.getDate() - 7);
        return d.toISOString().slice(0, 10);
      });
      const [toDate, setToDate] = useState(() => getTodayISO());
      const [singleDate, setSingleDate] = useState(() => getTodayISO());
      const [showRangePopup, setShowRangePopup] = useState(false);
      const [showDropdown, setShowDropdown] = useState(false);
      const dropdownRef = useRef(null);

      useEffect(() => {
        if (!confirmDeleteId) return;
        const timer = setTimeout(() => setConfirmDeleteId(null), 3000);
        return () => clearTimeout(timer);
      }, [confirmDeleteId]);

      useEffect(() => {
        if ((activeTab === 'dashboard' || zenMode) && !showQuickPopup && !showTypeManager && !duplicateConfirmData && !showSecretPage && !showRangePopup) {
          const timer = setTimeout(() => quickInputRef.current?.focus(), 60);
          return () => clearTimeout(timer);
        }
      }, [activeTab, zenMode, showQuickPopup, showTypeManager, duplicateConfirmData, showSecretPage, showRangePopup]);

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
            setShowDropdown(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      const validateTicketSubmission = useCallback((rawTicketNo) => {
        const cleaned = cleanTicketText(rawTicketNo, prefixRules);
        if (!cleaned) return { status: 'empty' };
        const targetISO = dashboardDate || getTodayISO();
        const sameDay = tickets.find(t => cleanTicketText(t.ticketNo, prefixRules).toLowerCase() === cleaned.toLowerCase() && getTicketISO(t) === targetISO);
        if (sameDay) return { status: 'same-day-duplicate', normalized: cleaned, existing: sameDay };
        const otherDay = tickets.find(t => cleanTicketText(t.ticketNo, prefixRules).toLowerCase() === cleaned.toLowerCase());
        if (otherDay) return { status: 'other-day-duplicate', normalized: cleaned, existing: otherDay };
        return { status: 'valid', normalized: cleaned };
      }, [tickets, prefixRules, dashboardDate]);

      const commitTicketEntry = useCallback((ticketNo, type, note, isBulk = false, isFlagged = false) => {
        const newTicket = {
          id: Date.now() + Math.random().toString(36).substr(2, 9),
          ticketNo: cleanTicketText(ticketNo, prefixRules),
          type,
          status: 'Completed',
          timeSpent: 5,
          description: note || 'Fast Entry Log',
          timestamp: new Date().toLocaleString(),
          createdAtMs: Date.now(),
          entryTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          isoDate: dashboardDate || getTodayISO(),
          flagged: isFlagged
        };
        setTickets(prev => [newTicket, ...prev]);
        setDuplicateConfirmData(null);
        if (!isBulk) {
          setQuickTicketNo('');
          setQuickNote('');
          setShowQuickPopup(false);
          setQuickFlagged(false);
          playFeedbackTone('success', soundEnabled, soundPack);
          setToast({ message: `Logged "${newTicket.ticketNo}" as ${type}`, type: 'success' });
          setLastUsedType(type);
          try { localStorage.setItem('lastUsedTaskType', type); } catch {}
          setTimeout(() => { if (quickInputRef.current) quickInputRef.current.focus(); }, 100);
        }
      }, [prefixRules, dashboardDate, soundEnabled, soundPack]);

      const handleQuickSave = useCallback((type) => {
        const check = validateTicketSubmission(quickTicketNo);
        if (check.status === 'empty') return;
        if (check.status === 'same-day-duplicate') {
          playFeedbackTone('error', soundEnabled, soundPack);
          setToast({ message: `Entry Denied! "${check.normalized}" already exists on ${dashboardDate || getTodayISO()} (${check.existing.type}).`, type: 'error' });
          return;
        }
        if (check.status === 'other-day-duplicate' && !duplicateConfirmData) {
          setDuplicateConfirmData({
            ticketNo: check.normalized,
            previousDate: getTicketISO(check.existing),
            previousType: check.existing.type,
            selectedType: type,
            note: quickNote,
            flagged: quickFlagged
          });
          return;
        }
        commitTicketEntry(quickTicketNo, type, quickNote, false, quickFlagged);
      }, [validateTicketSubmission, quickTicketNo, soundEnabled, soundPack, dashboardDate, duplicateConfirmData, quickNote, quickFlagged, commitTicketEntry]);

      const handleBulkSaveAll = useCallback((type) => {
        if (bulkTimerRef.current) {
          clearInterval(bulkTimerRef.current);
          setBulkCountdown(null);
        }

        let added = 0;
        const newEntries = [];
        const skipped = [];
        bulkQueue.forEach((tNo, idx) => {
          const check = validateTicketSubmission(tNo);
          if (check.status === 'same-day-duplicate') {
            skipped.push(check.normalized);
          } else {
            added++;
            newEntries.push({
              id: Date.now() + idx + Math.random().toString(36).substr(2, 9),
              ticketNo: check.normalized,
              type,
              status: 'Completed',
              timeSpent: 5,
              description: quickNote || 'Bulk Fast Entry',
              timestamp: new Date().toLocaleString(),
              createdAtMs: Date.now() + idx,
              entryTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
              isoDate: dashboardDate || getTodayISO(),
              flagged: quickFlagged
            });
          }
        });

        if (newEntries.length > 0) {
          setTickets(prev => [...newEntries, ...prev]);
          setLastUsedType(type);
          try { localStorage.setItem('lastUsedTaskType', type); } catch {}
        }

        setQuickTicketNo('');
        setQuickNote('');
        setBulkQueue([]);
        setShowQuickPopup(false);
        setQuickFlagged(false);

        if (skipped.length > 0) {
          playFeedbackTone('error', soundEnabled, soundPack);
          setToast({ message: `Bulk Logged ${added}. Skipped ${skipped.length} duplicates.`, type: 'error' });
        } else {
          playFeedbackTone('success', soundEnabled, soundPack);
          setToast({ message: `Successfully logged ${added} tickets as ${type}`, type: 'success' });
        }
        setTimeout(() => { if (quickInputRef.current) quickInputRef.current.focus(); }, 100);
      }, [bulkQueue, validateTicketSubmission, quickNote, dashboardDate, quickFlagged, soundEnabled, soundPack]);

      const initiateBulkSaveCountdown = useCallback((type) => {
        if (bulkCountdown !== null) {
          clearInterval(bulkTimerRef.current);
          setBulkCountdown(null);
          handleBulkSaveAll(type);
          return;
        }
        
        playFeedbackTone('error', soundEnabled, soundPack);
        setToast({ message: 'SELECT BULK TYPE! Auto-saving in 3 seconds...', type: 'error' });
        
        let count = 3;
        setBulkCountdown(count);
        
        bulkTimerRef.current = setInterval(() => {
          count -= 1;
          if (count > 0) {
            setBulkCountdown(count);
          } else {
            clearInterval(bulkTimerRef.current);
            setBulkCountdown(null);
            handleBulkSaveAll(type);
          }
        }, 1000);
      }, [bulkCountdown, handleBulkSaveAll, soundEnabled, soundPack]);

      // --- Advanced Ninja Bulk Submit (From Secret Page) ---
      const handleSecretBulkSubmit = () => {
        const tokens = extractBulkTickets(secretBulkInput, prefixRules);
        if (tokens.length === 0) {
          setToast({ message: 'No valid tickets found to log.', type: 'error' });
          return;
        }

        let added = 0;
        const newEntries = [];
        const targetISO = dashboardDate || getTodayISO();

        tokens.forEach((tNo, idx) => {
          const cleaned = cleanTicketText(tNo, prefixRules);
          const exists = tickets.find(t => cleanTicketText(t.ticketNo, prefixRules).toLowerCase() === cleaned.toLowerCase() && getTicketISO(t) === targetISO);
          
          if (!exists) {
            added++;
            newEntries.push({
              id: Date.now() + idx + Math.random().toString(36).substr(2, 9),
              ticketNo: cleaned,
              type: secretBulkType,
              status: 'Completed',
              timeSpent: 5,
              description: secretBulkCustomNote || 'Ninja Bulk Log',
              timestamp: new Date().toLocaleString(),
              createdAtMs: Date.now() + idx,
              entryTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
              isoDate: targetISO,
              flagged: false
            });
          }
        });

        if (newEntries.length > 0) {
          setTickets(prev => [...newEntries, ...prev]);
        }

        setSecretBulkInput('');
        setSecretBulkCustomNote('');
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: `Ninja Logged ${added} tickets successfully! Skipped ${tokens.length - added} duplicates.`, type: 'success' });
      };

      // --- JSON Data Backup / Restore ---
      const handleExportJSON = () => {
        const data = {
          tickets,
          trashedTickets,
          taskTypes,
          prefixRules,
          secretNotes, 
          settings: { dailyTarget, weeklyTarget, monthlyTarget, theme, soundPack, compactView }
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `NasirTicketFlow_Backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setToast({ message: 'Backup successfully exported!', type: 'success' });
      };

      const handleImportJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.tickets && Array.isArray(data.tickets)) {
              setTickets(data.tickets);
              if (data.trashedTickets) setTrashedTickets(data.trashedTickets);
              if (data.taskTypes) setTaskTypes(data.taskTypes);
              if (data.prefixRules) setPrefixRules(data.prefixRules);
              if (data.secretNotes) {
                setSecretNotes(data.secretNotes);
                if (data.secretNotes.length > 0) setActiveNoteId(data.secretNotes[0].id);
              }
              if (data.settings) {
                if (data.settings.dailyTarget) setDailyTarget(data.settings.dailyTarget);
                if (data.settings.weeklyTarget) setWeeklyTarget(data.settings.weeklyTarget);
                if (data.settings.monthlyTarget) setMonthlyTarget(data.settings.monthlyTarget);
                if (data.settings.theme) setTheme(data.settings.theme);
              }
              playFeedbackTone('success', soundEnabled, soundPack);
              setToast({ message: 'Data restored successfully!', type: 'success' });
              setShowSecretPage(false);
            } else {
              setToast({ message: 'Invalid backup file format.', type: 'error' });
            }
          } catch (err) {
            setToast({ message: 'Error reading JSON file.', type: 'error' });
          }
        };
        reader.readAsText(file);
      };

      const handleUndoLastEntry = useCallback(() => {
        if (tickets.length === 0) return;
        const [latest, ...rest] = tickets;
        setTickets(rest);
        playFeedbackTone('error', soundEnabled, soundPack);
        setToast({ message: `Undid entry "${cleanTicketText(latest.ticketNo, prefixRules)}" (${latest.type})`, type: 'success' });
      }, [tickets, soundEnabled, soundPack, prefixRules]);

      // Global Keyboard Shortcuts (Including Secret Keylogger and Popup Controls)
      useEffect(() => {
        const handleGlobalKeyDown = (e) => {
          const activeEl = document.activeElement;
          const isTypingField = activeEl && (activeEl.tagName === 'TEXTAREA' || (activeEl.tagName === 'INPUT' && activeEl.type !== 'checkbox' && activeEl.type !== 'radio'));

          // Secret Page Keylogger (listens outside inputs)
          if (!isTypingField) {
            keyBuffer.current = (keyBuffer.current + e.key.toLowerCase()).slice(-13);
            if (keyBuffer.current === 'tigerhunter43') {
              setShowSecretPage(true);
              keyBuffer.current = '';
            }
          }

          // Global Undo (Ctrl+Z)
          if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
            if (!isTypingField && !showQuickPopup && !duplicateConfirmData && !showTypeManager && !showSecretPage && !showRangePopup) {
              if (tickets.length > 0) {
                e.preventDefault();
                handleUndoLastEntry();
              }
              return;
            }
          }

          // ESC to close popups
          if (e.key === 'Escape') {
            if (showQuickPopup) { 
              setShowQuickPopup(false); 
              setBulkQueue([]); 
              if (bulkTimerRef.current) {
                clearInterval(bulkTimerRef.current);
                setBulkCountdown(null);
              }
            }
            else if (duplicateConfirmData) { setDuplicateConfirmData(null); setTimeout(() => quickInputRef.current?.focus(), 50); }
            else if (showTypeManager) { setShowTypeManager(false); setEditingTypeIdx(null); }
            else if (showRangePopup) { setShowRangePopup(false); }
            else if (showSecretPage) { setShowSecretPage(false); }
            else if (zenMode) { setZenMode(false); }
            return;
          }

          // Keyboard handling for Quick Entry Popup
          if (showQuickPopup) {
            const isPopupNote = activeEl?.dataset?.popupNote === 'true';
            if (e.key === 'Enter') {
              e.preventDefault();
              if (bulkQueue.length > 1) {
                if (bulkCountdown !== null) {
                  clearInterval(bulkTimerRef.current);
                  setBulkCountdown(null);
                  handleBulkSaveAll(lastUsedType);
                } else {
                  initiateBulkSaveCountdown(lastUsedType);
                }
              }
              else handleQuickSave(lastUsedType);
            } else if (!isNaN(parseInt(e.key, 10)) && !isPopupNote) {
              const num = parseInt(e.key, 10);
              if (num >= 1 && num <= taskTypes.length) {
                e.preventDefault();
                if (bulkQueue.length > 1) handleBulkSaveAll(taskTypes[num - 1]);
                else handleQuickSave(taskTypes[num - 1]);
              }
            }
          }
          // Keyboard handling for Duplicate Confirmation Prompt
          else if (duplicateConfirmData) {
            if (e.key === 'Enter') {
              e.preventDefault();
              commitTicketEntry(duplicateConfirmData.ticketNo, duplicateConfirmData.selectedType, duplicateConfirmData.note || '', false, duplicateConfirmData.flagged);
            }
          }
        };
        window.addEventListener('keydown', handleGlobalKeyDown);
        return () => window.removeEventListener('keydown', handleGlobalKeyDown);
      }, [showQuickPopup, duplicateConfirmData, showTypeManager, showRangePopup, showSecretPage, zenMode, taskTypes, lastUsedType, bulkQueue, tickets.length, handleUndoLastEntry, handleQuickSave, handleBulkSaveAll, commitTicketEntry]);

      const processIncomingText = (rawText) => {
        const tokens = extractBulkTickets(rawText, prefixRules);
        if (tokens.length === 0) return;

        if (tokens.length > 1) {
          setBulkQueue(tokens);
          setQuickTicketNo(tokens[0]);
          setShowQuickPopup(true);
          setToast({ message: `Bulk Paste: ${tokens.length} tickets queued!`, type: 'success' });
          return;
        }

        setBulkQueue([]);
        initiateQuickPopup(tokens[0]);
      };

      const initiateQuickPopup = (rawValue) => {
        const check = validateTicketSubmission(rawValue);
        if (check.status === 'empty') return;

        if (check.status === 'same-day-duplicate') {
          playFeedbackTone('error', soundEnabled, soundPack);
          setToast({ message: `Entry Denied! "${check.normalized}" already exists on ${dashboardDate} (${check.existing.type}).`, type: 'error' });
          setQuickTicketNo('');
          setShowQuickPopup(false);
          setTimeout(() => {
            if (quickInputRef.current) quickInputRef.current.focus();
          }, 50);
          return;
        }

        if (check.status === 'other-day-duplicate') {
          // Instantly pop up the confirmation modal if it's an other-day duplicate
          setQuickTicketNo(check.normalized);
          setDuplicateConfirmData({
            ticketNo: check.normalized,
            previousDate: getTicketISO(check.existing),
            previousType: check.existing.type,
            selectedType: lastUsedType,
            note: '',
            flagged: false
          });
          return;
        }

        setQuickTicketNo(check.normalized);
        setShowQuickPopup(true);
      };

      const handleQuickPaste = (e) => {
        const pasted = e.clipboardData.getData('text');
        if (pasted) {
          e.preventDefault();
          processIncomingText(pasted);
        }
      };

      const handleOneClickClipboardPaste = async () => {
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const text = await navigator.clipboard.readText();
            if (text && text.trim()) {
              processIncomingText(text);
            } else {
              playFeedbackTone('error', soundEnabled, soundPack);
              setToast({ message: 'Clipboard is empty!', type: 'error' });
            }
          } else {
            quickInputRef.current?.focus();
            setToast({ message: 'Press Ctrl+V to paste ticket.', type: 'error' });
          }
        } catch {
          quickInputRef.current?.focus();
          setToast({ message: 'Clipboard access blocked by browser — press Ctrl+V.', type: 'error' });
        }
      };
      
      const handleQuickKeyDown = (e) => {
        if (e.key === 'Enter' && cleanTicketText(quickTicketNo, prefixRules) && !showQuickPopup && !duplicateConfirmData) {
          e.preventDefault();
          processIncomingText(quickTicketNo);
        }
      };

      const toggleTicketFlag = (id) => {
        setTickets(prev => prev.map(t => t.id === id ? { ...t, flagged: !t.flagged } : t));
      };

      const handleCopyTicketId = (rawNo) => {
        const clean = cleanTicketText(rawNo, prefixRules);
        if (!clean) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(clean).then(() => {
            playFeedbackTone('success', soundEnabled, soundPack);
            setToast({ message: `Copied "${clean}" to clipboard!`, type: 'success' });
          }).catch(() => fallbackCopy(clean));
        } else {
          fallbackCopy(clean);
        }
      };

      const fallbackCopy = (text, customMsg) => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          playFeedbackTone('success', soundEnabled, soundPack);
          setToast({ message: customMsg || `Copied "${text}" to clipboard!`, type: 'success' });
        } catch {
          setToast({ message: 'Failed to copy to clipboard.', type: 'error' });
        }
        document.body.removeChild(textarea);
      };

      const toggleSelectRow = (id) => setSelectedIds(prev => prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]);

      const toggleSelectAllFiltered = () => {
        const allFilteredIds = filteredTickets.map(t => t.id);
        const allSelected = allFilteredIds.length > 0 && allFilteredIds.every(id => selectedIds.includes(id));
        if (allSelected) {
          setSelectedIds(prev => prev.filter(id => !allFilteredIds.includes(id)));
        } else {
          setSelectedIds(prev => Array.from(new Set([...prev, ...allFilteredIds])));
        }
      };

      const handleBulkTypeChange = (newType) => {
        if (!newType || selectedIds.length === 0) return;
        setTickets(prev => prev.map(t => selectedIds.includes(t.id) ? { ...t, type: newType } : t));
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: `Updated ${selectedIds.length} tickets to ${newType}`, type: 'success' });
        setSelectedIds([]);
        setBulkActionType('');
      };

      const handleBulkDelete = () => {
        if (selectedIds.length === 0) return;
        const toTrash = tickets.filter(t => selectedIds.includes(t.id)).map(t => ({ ...t, deletedAt: Date.now() }));
        setTrashedTickets(prev => [...toTrash, ...prev]);
        setTickets(prev => prev.filter(t => !selectedIds.includes(t.id)));
        setSelectedIds([]);
        playFeedbackTone('error', soundEnabled, soundPack);
        setToast({ message: `Moved ${toTrash.length} tickets to Trash.`, type: 'success' });
      };

      const handleDeleteRequest = (id) => {
        if (confirmDeleteId === id) {
          const item = tickets.find(t => t.id === id);
          if (item) {
            setTrashedTickets(prev => [{ ...item, deletedAt: Date.now() }, ...prev]);
          }
          setTickets(prev => prev.filter(t => t.id !== id));
          setConfirmDeleteId(null);
          playFeedbackTone('error', soundEnabled, soundPack);
          setToast({ message: 'Moved ticket to Trash (30-day retention).', type: 'success' });
        } else {
          setConfirmDeleteId(id);
          setToast({ message: 'Click Confirm within 3s to move to Trash!', type: 'error' });
        }
      };

      const handleRestoreTicket = (id) => {
        const item = trashedTickets.find(t => t.id === id);
        if (!item) return;
        const { deletedAt, ...restoredTicket } = item;
        setTickets(prev => [restoredTicket, ...prev]);
        setTrashedTickets(prev => prev.filter(t => t.id !== id));
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: `Restored "${cleanTicketText(item.ticketNo, prefixRules)}"!`, type: 'success' });
      };

      const handlePermanentDelete = (id) => {
        setTrashedTickets(prev => prev.filter(t => t.id !== id));
        playFeedbackTone('error', soundEnabled, soundPack);
        setToast({ message: 'Permanently deleted ticket.', type: 'success' });
      };

      const handleEmptyTrash = () => {
        setTrashedTickets([]);
        playFeedbackTone('error', soundEnabled, soundPack);
        setToast({ message: 'Trash emptied completely.', type: 'success' });
      };

      const handleAddPrefixRule = (e) => {
        e.preventDefault();
        const trimmed = newPrefixRule.trim();
        if (!trimmed) return;
        if (prefixRules.some(r => r.toLowerCase() === trimmed.toLowerCase())) {
          setToast({ message: 'Prefix rule already exists!', type: 'error' });
          return;
        }
        setPrefixRules(prev => [...prev, trimmed]);
        setNewPrefixRule('');
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: `Added prefix cleaner "${trimmed}"`, type: 'success' });
      };

      const handleRemovePrefixRule = (idx) => setPrefixRules(prev => prev.filter((_, i) => i !== idx));

      const handleExportCSV = () => {
        if (tickets.length === 0) {
          setToast({ message: 'No tickets to export!', type: 'error' });
          return;
        }
        const headers = ['Ticket No', 'Task Type', 'Status', 'Time Spent (mins)', 'Description', 'Entry Time', 'Date/Time'];
        const csvContent = [
          headers.join(','),
          ...tickets.map(t => `"${cleanTicketText(t.ticketNo, prefixRules)}","${t.type}","${t.status}","${t.timeSpent || 0}","${(t.description || '').replace(/"/g, '""')}","${t.entryTime || ''}","${t.timestamp}"`)
        ].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `Work_Report_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setToast({ message: 'Report exported to CSV!', type: 'success' });
      };

      const handleCopyRangeSpreadsheet = () => {
        if (rangeTickets.length === 0) return;
        const groupedSections = rangeStatsByType.flatMap((stat) => {
          const groupTickets = rangeTickets.filter((t) => t.type === stat.name);
          return [
            '',
            `${stat.name.toUpperCase()} (${groupTickets.length})`,
            'SL\tTicket Number\tWork Type\tDate & Time',
            ...groupTickets.map((t, idx) => `${idx + 1}\t${cleanTicketText(t.ticketNo, prefixRules)}\t${t.type}\t${t.timestamp}`)
          ];
        });
        const summaryLines = [
          `WORK REPORT SUMMARY (${fromDate} to ${toDate || getTodayISO()})`,
          `Total Tickets:\t${rangeTickets.length}`,
          '',
          'COUNT BY WORK TYPE',
          'Work Type\tCount',
          ...rangeStatsByType.map(s => `${s.name}\t${s.count}`),
          ...groupedSections
        ];
        fallbackCopy(summaryLines.join('\n'), 'Copied in spreadsheet format!');
      };

      const handleDownloadRangeCSV = () => {
        if (rangeTickets.length === 0) return;
        const groupedCsvSections = rangeStatsByType.flatMap((stat) => {
          const groupTickets = rangeTickets.filter((t) => t.type === stat.name);
          return [
            '',
            `"${stat.name.toUpperCase()} (${groupTickets.length})"`,
            '"SL","Ticket Number","Work Type","Date & Time"',
            ...groupTickets.map((t, idx) => `"${idx + 1}","${cleanTicketText(t.ticketNo, prefixRules)}","${t.type}","${t.timestamp}"`)
          ];
        });
        const csvLines = [
          `"WORK REPORT SUMMARY (${fromDate} to ${toDate || getTodayISO()})"`,
          `"Total Tickets","${rangeTickets.length}"`,
          '',
          '"COUNT BY WORK TYPE"',
          '"Work Type","Count"',
          ...rangeStatsByType.map(s => `"${s.name}","${s.count}"`),
          ...groupedCsvSections
        ];
        const blob = new Blob([csvLines.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `Work_Summary_${fromDate}_to_${toDate || getTodayISO()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setToast({ message: 'Spreadsheet CSV downloaded!', type: 'success' });
      };

      const updateTicketStatus = (id, newStatus) => setTickets(prev => prev.map(t => t.id === id ? { ...t, status: newStatus } : t));
      
      const updateTicketType = (id, newType) => {
        setTickets(prev => prev.map(t => t.id === id ? { ...t, type: newType } : t));
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: `Updated work type to ${newType}`, type: 'success' });
      };

      const updateTicketNote = (id, newNote) => {
        setTickets(prev => prev.map(t => t.id === id ? { ...t, description: newNote.trim() || 'Fast Entry Log' } : t));
        setEditingNoteId(null);
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: 'Note updated!', type: 'success' });
      };

      const handleAddTaskType = (e) => {
        e.preventDefault();
        const trimmed = newTypeName.trim();
        if (!trimmed) return;
        if (taskTypes.some(t => t.toLowerCase() === trimmed.toLowerCase())) {
          playFeedbackTone('error', soundEnabled, soundPack);
          setToast({ message: `"${trimmed}" already exists!`, type: 'error' });
          return;
        }
        setTaskTypes(prev => [...prev, trimmed]);
        setNewTypeName('');
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: `Added "${trimmed}"`, type: 'success' });
      };

      const handleRenameTaskType = (idx) => {
        const oldName = taskTypes[idx];
        const trimmed = editingTypeVal.trim();
        if (!trimmed || trimmed === oldName) {
          setEditingTypeIdx(null);
          return;
        }
        if (taskTypes.some((t, i) => i !== idx && t.toLowerCase() === trimmed.toLowerCase())) {
          playFeedbackTone('error', soundEnabled, soundPack);
          setToast({ message: `"${trimmed}" already exists!`, type: 'error' });
          return;
        }
        setTaskTypes(prev => prev.map((t, i) => i === idx ? trimmed : t));
        setTickets(prev => prev.map(tk => tk.type === oldName ? { ...tk, type: trimmed } : tk));
        if (lastUsedType === oldName) setLastUsedType(trimmed);
        setEditingTypeIdx(null);
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: `Renamed "${oldName}" to "${trimmed}"`, type: 'success' });
      };

      const handleRemoveTaskType = (idx) => {
        if (taskTypes.length <= 1) {
          setToast({ message: 'At least 1 work type must remain.', type: 'error' });
          return;
        }
        const removed = taskTypes[idx];
        const nextTypes = taskTypes.filter((_, i) => i !== idx);
        setTaskTypes(nextTypes);
        if (lastUsedType === removed) setLastUsedType(nextTypes[0]);
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: `Removed "${removed}"`, type: 'success' });
      };

      const handleDragOver = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
      const handleDrop = (e, targetStatus) => {
        e.preventDefault();
        if (draggedTicket && draggedTicket.status !== targetStatus) {
          updateTicketStatus(draggedTicket.id, targetStatus);
          setToast({ message: `Moved to ${targetStatus}`, type: 'success' });
        }
        setDraggedTicket(null);
      };
      const handleDragStart = (e, ticket) => {
        setDraggedTicket(ticket);
        e.dataTransfer.effectAllowed = 'move';
      };

      const filteredTickets = useMemo(() => {
        return tickets.filter(t => {
          const cleanNo = cleanTicketText(t.ticketNo, prefixRules);
          const matchSearch = cleanNo.toLowerCase().includes(searchTerm.toLowerCase()) || 
                              (t.description || '').toLowerCase().includes(searchTerm.toLowerCase());
          const matchType = filterType === 'All' || t.type === filterType;
          const matchFlag = !onlyFlagged || Boolean(t.flagged);
          return matchSearch && matchType && matchFlag;
        });
      }, [tickets, searchTerm, filterType, onlyFlagged, prefixRules]);

      const rangeTickets = useMemo(() => {
        return tickets.filter(t => {
          const iso = getTicketISO(t);
          if (fromDate && iso < fromDate) return false;
          if (toDate && iso > toDate) return false;
          return true;
        });
      }, [tickets, fromDate, toDate]);

      const rangeStatsByType = useMemo(() => {
        const counts = {};
        taskTypes.forEach(type => { counts[type] = 0; });
        rangeTickets.forEach(t => { counts[t.type] = (counts[t.type] || 0) + 1; });
        return Object.keys(counts)
          .filter(k => counts[k] > 0)
          .map((key, idx) => ({ name: key, count: counts[key], color: COLORS[idx % COLORS.length] }));
      }, [rangeTickets, taskTypes]);

      const singleDateTickets = useMemo(() => {
        if (!singleDate) return [];
        return tickets.filter(t => getTicketISO(t) === singleDate);
      }, [tickets, singleDate]);

      const statsByType = useMemo(() => {
        const stats = {};
        tickets.forEach(t => {
          if (!stats[t.type]) stats[t.type] = { count: 0, time: 0 };
          stats[t.type].count += 1;
          stats[t.type].time += (t.timeSpent || 0);
        });
        return Object.keys(stats).map((key, index) => ({
          name: key, count: stats[key].count, time: stats[key].time, color: COLORS[index % COLORS.length]
        }));
      }, [tickets]);

      const dashboardTickets = useMemo(() => {
        const target = dashboardDate || getTodayISO();
        return tickets.filter(t => getTicketISO(t) === target);
      }, [tickets, dashboardDate]);

      const dashboardStatsByType = useMemo(() => {
        const stats = {};
        dashboardTickets.forEach(t => {
          if (!stats[t.type]) stats[t.type] = { count: 0, time: 0 };
          stats[t.type].count += 1;
          stats[t.type].time += (t.timeSpent || 0);
        });
        return Object.keys(stats).map((key, index) => ({
          name: key, count: stats[key].count, time: stats[key].time, color: COLORS[index % COLORS.length]
        }));
      }, [dashboardTickets]);

      const totalTickets = dashboardTickets.length;
      const targetPercentage = Math.min(100, Math.round((totalTickets / Math.max(1, dailyTarget)) * 100));

      const goalProgress = useMemo(() => {
        const now = new Date();
        const startOfWeek = new Date(now);
        startOfWeek.setDate(now.getDate() - now.getDay());
        const weekISO = `${startOfWeek.getFullYear()}-${String(startOfWeek.getMonth() + 1).padStart(2, '0')}-${String(startOfWeek.getDate()).padStart(2, '0')}`;
        const monthPrefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

        let weekCount = 0;
        let monthCount = 0;
        tickets.forEach(t => {
          const iso = getTicketISO(t);
          if (iso >= weekISO) weekCount++;
          if (iso.startsWith(monthPrefix)) monthCount++;
        });

        return {
          weekCount,
          weekPct: Math.min(100, Math.round((weekCount / Math.max(1, weeklyTarget)) * 100)),
          monthCount,
          monthPct: Math.min(100, Math.round((monthCount / Math.max(1, monthlyTarget)) * 100))
        };
      }, [tickets, weeklyTarget, monthlyTarget]);

      const ticketsPerHour = useMemo(() => {
        if (dashboardTickets.length === 0) return '0.0';
        if (dashboardTickets.length === 1) return '1.0';
        const timestamps = dashboardTickets
          .map(t => t.createdAtMs || Number(String(t.id).split('-')[0]))
          .filter(n => !isNaN(n) && n > 0);
        if (timestamps.length < 2) return dashboardTickets.length.toFixed(1);
        const minMs = Math.min(...timestamps);
        const maxMs = Math.max(...timestamps);
        const elapsedHours = Math.max((maxMs - minMs) / (1000 * 60 * 60), 0.25);
        return (dashboardTickets.length / elapsedHours).toFixed(1);
      }, [dashboardTickets]);

      const predictiveInsight = useMemo(() => {
        const remaining = dailyTarget - totalTickets;
        if (remaining <= 0) return { text: 'Daily target achieved! Great momentum.', done: true };
        const rate = parseFloat(ticketsPerHour);
        if (!rate || rate <= 0 || totalTickets < 2) return { text: 'Log 2+ tickets to unlock AI ETA forecast', done: false };
        const hoursNeeded = remaining / rate;
        if (hoursNeeded > 16) return { text: `Need ~${hoursNeeded.toFixed(1)} hrs at current pace`, done: false };
        const eta = new Date(Date.now() + hoursNeeded * 3600 * 1000);
        const etaStr = eta.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        return { text: `AI Forecast: Target hits around ${etaStr}`, done: false };
      }, [dailyTarget, totalTickets, ticketsPerHour]);

      const streakAndBest = useMemo(() => {
        const countsByDay = {};
        tickets.forEach(t => {
          const iso = getTicketISO(t);
          countsByDay[iso] = (countsByDay[iso] || 0) + 1;
        });

        let bestDayCount = 0;
        let bestDayDate = '';
        Object.entries(countsByDay).forEach(([day, cnt]) => {
          if (cnt > bestDayCount) { bestDayCount = cnt; bestDayDate = day; }
        });

        let streak = 0;
        const cursor = new Date();
        const formatLocal = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

        const todayStr = formatLocal(cursor);
        if ((countsByDay[todayStr] || 0) < dailyTarget) cursor.setDate(cursor.getDate() - 1);

        while (true) {
          const key = formatLocal(cursor);
          if ((countsByDay[key] || 0) >= dailyTarget) {
            streak++;
            cursor.setDate(cursor.getDate() - 1);
          } else break;
        }
        return { streak, bestDayCount, bestDayDate };
      }, [tickets, dailyTarget]);

      const unlockedBadges = useMemo(() => {
        const badges = [];
        const speed = parseFloat(ticketsPerHour);
        if (speed >= 50 || streakAndBest.bestDayCount >= 100) {
          badges.push({ id: 'speed-demon', label: 'Speed Demon', desc: '50+ tickets/hr pace or 100+ in a day', color: 'bg-purple-100 text-purple-700 border-purple-300 dark:bg-purple-900/50 dark:text-purple-300 dark:border-purple-600', icon: 'Zap' });
        }
        if (streakAndBest.streak >= 7) {
          badges.push({ id: 'marathoner', label: 'Marathoner', desc: '7+ day target streak', color: 'bg-orange-100 text-orange-700 border-orange-300 dark:bg-orange-900/50 dark:text-orange-300 dark:border-orange-600', icon: 'Flame' });
        } else if (streakAndBest.streak >= 3) {
          badges.push({ id: 'consistent', label: 'On Fire', desc: '3+ day target streak', color: 'bg-amber-100 text-amber-700 border-amber-300 dark:bg-amber-900/50 dark:text-amber-300 dark:border-amber-600', icon: 'Flame' });
        }
        if (totalTickets >= dailyTarget && dailyTarget > 0) {
          badges.push({ id: 'goal-crusher', label: 'Goal Crusher', desc: 'Hit 100% of daily target', color: 'bg-emerald-100 text-emerald-700 border-emerald-300 dark:bg-emerald-900/50 dark:text-emerald-300 dark:border-emerald-600', icon: 'Target' });
        }
        if (tickets.length >= 500) {
          badges.push({ id: 'veteran', label: '500 Club', desc: '500+ total tickets logged', color: 'bg-blue-100 text-blue-700 border-blue-300 dark:bg-blue-900/50 dark:text-blue-300 dark:border-blue-600', icon: 'Award' });
        } else if (tickets.length >= 100) {
          badges.push({ id: 'centurion', label: 'Centurion', desc: '100+ total tickets logged', color: 'bg-sky-100 text-sky-700 border-sky-300 dark:bg-sky-900/50 dark:text-sky-300 dark:border-sky-600', icon: 'Award' });
        }
        return badges;
      }, [ticketsPerHour, streakAndBest, totalTickets, dailyTarget, tickets.length]);

      const activityHeatmapWeeks = useMemo(() => {
        const countsByDay = {};
        tickets.forEach(t => {
          const iso = getTicketISO(t);
          countsByDay[iso] = (countsByDay[iso] || 0) + 1;
        });

        const weeks = [];
        const today = new Date();
        const start = new Date(today);
        start.setDate(today.getDate() - (23 * 7) - today.getDay());

        let cursor = new Date(start);
        for (let w = 0; w < 24; w++) {
          const days = [];
          for (let d = 0; d < 7; d++) {
            const iso = `${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, '0')}-${String(cursor.getDate()).padStart(2, '0')}`;
            const count = countsByDay[iso] || 0;
            const isFuture = cursor > today;
            days.push({ iso, count, isFuture });
            cursor.setDate(cursor.getDate() + 1);
          }
          weeks.push(days);
        }
        return weeks;
      }, [tickets]);

      const hourlyProductivity = useMemo(() => {
        const buckets = {};
        dashboardTickets.forEach(t => {
          let hr = typeof t.entryHour === 'number' ? t.entryHour : null;
          if (hr === null && t.createdAtMs) {
            hr = new Date(t.createdAtMs).getHours();
          } else if (hr === null && t.entryTime) {
            const match = t.entryTime.match(/(\d+):\d+:\d+\s*(AM|PM)?/i);
            if (match) {
              let h = parseInt(match[1], 10);
              const mer = (match[2] || '').toUpperCase();
              if (mer === 'PM' && h < 12) h += 12;
              if (mer === 'AM' && h === 12) h = 0;
              hr = h;
            }
          }
          if (hr !== null && !isNaN(hr)) buckets[hr] = (buckets[hr] || 0) + 1;
        });

        const hours = Object.keys(buckets).map(Number).sort((a, b) => a - b);
        if (hours.length === 0) return [];
        const minH = Math.min(...hours);
        const maxH = Math.max(...hours);
        const result = [];
        for (let h = minH; h <= maxH; h++) {
          const label = h === 0 ? '12 AM' : h < 12 ? `${h} AM` : h === 12 ? '12 PM' : `${h - 12} PM`;
          result.push({ hour: label, count: buckets[h] || 0 });
        }
        return result;
      }, [dashboardTickets]);

      const liveLookupStatus = useMemo(() => {
        const cleaned = cleanTicketText(quickTicketNo, prefixRules).replace(/\s+/g, ' ').trim();
        if (!cleaned || cleaned.includes(' ')) return null;
        const matches = tickets.filter(
          t => cleanTicketText(t.ticketNo, prefixRules).replace(/\s+/g, ' ').trim().toLowerCase() === cleaned.toLowerCase()
        );
        if (matches.length === 0) return { state: 'new', ticket: cleaned };
        const targetISO = dashboardDate || getTodayISO();
        const sameDay = matches.find(m => getTicketISO(m) === targetISO);
        if (sameDay) return { state: 'same-day', ticket: cleaned, type: sameDay.type, date: targetISO };
        return { state: 'other-day', ticket: cleaned, type: matches[0].type, date: getTicketISO(matches[0]) };
      }, [quickTicketNo, tickets, prefixRules, dashboardDate]);

      // --- Render Helpers ---
      const renderPasteCard = (isZen = false) => (
        <div 
          onClick={() => quickInputRef.current?.focus()}
          className={`w-full ${isZen ? 'max-w-xl min-h-[380px] p-8 sm:p-10 shadow-2xl' : 'h-full min-h-[320px] p-6 sm:p-7 shadow-lg shadow-blue-500/10 dark:shadow-blue-950/40'} bg-gradient-to-br from-white via-blue-50/60 to-indigo-100/60 dark:from-slate-800 dark:via-blue-950/40 dark:to-indigo-950/50 rounded-3xl border-2 border-blue-200/80 dark:border-blue-500/30 flex flex-col items-center justify-center text-center cursor-text hover:border-blue-500 dark:hover:border-blue-400 transition-all relative overflow-hidden`}
        >
          <div className="absolute top-0 inset-x-0 h-1.5 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500" />

          <button
            type="button"
            onClick={(e) => { e.stopPropagation(); setZenMode(!zenMode); }}
            className={`absolute top-4 left-4 inline-flex items-center gap-1 px-2.5 py-1 rounded-xl text-[11px] font-semibold transition-colors ${
              isZen
                ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-sm'
                : 'bg-white/80 hover:bg-blue-600 text-slate-700 hover:text-white dark:bg-slate-800/90 dark:hover:bg-blue-600 dark:text-slate-200 border border-blue-200/70 dark:border-slate-600 shadow-xs'
            }`}
            title={isZen ? 'Exit Zen Mode (ESC)' : 'Enter distraction-free Zen Mode'}
          >
            <Icon name={isZen ? 'Minimize2' : 'Maximize2'} className="w-3.5 h-3.5" />
            <span>{isZen ? 'Exit Zen' : 'Zen Mode'}</span>
          </button>

          {tickets.length > 0 && (
            <button

              onClick={(e) => { e.stopPropagation(); handleUndoLastEntry(); }}
              className={`absolute top-4 right-4 inline-flex items-center gap-1 px-2.5 py-1 rounded-xl text-[11px] font-semibold bg-white/80 hover:bg-rose-500 text-slate-700 hover:text-white dark:bg-slate-800/90 dark:hover:bg-rose-600 dark:text-slate-200 border border-rose-200/70 dark:border-slate-600 shadow-xs transition-all duration-1000 ${showUndoBtn ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-2 pointer-events-none'}`}
              title={`Undo last ticket (Ctrl+Z): ${cleanTicketText(tickets[0].ticketNo, prefixRules)}`}
            >
              <Icon name="Undo2" className="w-3.5 h-3.5" />
              <span>Undo (Ctrl+Z)</span>
            </button>

          {isZen && (
            <div className="mb-3 flex items-center gap-3 text-xs font-bold text-slate-600 dark:text-slate-300">
              <span>Today: <strong className="text-blue-600 dark:text-blue-400">{totalTickets}/{dailyTarget}</strong></span>
              <span>•</span>
              <span>Speed: <strong className="text-emerald-600 dark:text-emerald-400">{ticketsPerHour}/hr</strong></span>
            </div>

          <h2 className="text-xl sm:text-2xl font-extrabold bg-gradient-to-r from-blue-700 via-indigo-700 to-purple-700 dark:from-blue-300 dark:via-indigo-300 dark:to-purple-300 bg-clip-text text-transparent mb-5">
            Paste Ticket to Log

          <div className="w-full flex flex-col gap-3">

              ref={quickInputRef}
              type="text"

              onPaste={handleQuickPaste}
              onKeyDown={handleQuickKeyDown}
              placeholder="Paste single or bulk tickets..."
              className="neon-glow w-full text-center text-base font-semibold px-4 py-4 rounded-2xl border-2 bg-white/95 dark:bg-slate-900/90 text-slate-800 dark:text-white outline-none transition-all duration-300 placeholder:text-slate-400"
            />
            {liveLookupStatus && (
              <div className="flex justify-center">
                {liveLookupStatus.state === 'new' && (
                  <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-semibold bg-emerald-100/90 dark:bg-emerald-900/50 text-emerald-800 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-700">

              >
                Select Type
              </button>

      );

      const renderDashboard = () => (
        <div className="space-y-6">
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 items-stretch">

              <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-blue-500" />
              <div className="pl-2">
                <p className="text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Tickets ({dashboardDate})</p>
                <h3 className="text-3xl font-bold text-slate-800 dark:text-white tracking-tight">{totalTickets}</h3>
                <div className="mt-2 flex items-center gap-2 text-[10px] font-medium text-slate-400 dark:text-slate-500">

                  <span className="w-1 h-1 rounded-full bg-slate-300 dark:bg-slate-600"></span>
                  <span>Mo: <strong className="text-blue-600 dark:text-blue-400">{goalProgress.monthCount}/{monthlyTarget}</strong></span>
                </div>
              </div>
              <div className="w-12 h-12 rounded-2xl bg-blue-50 dark:bg-blue-500/10 flex items-center justify-center text-blue-600 dark:text-blue-400 group-hover:scale-110 transition-transform duration-300 shrink-0">
                <Icon name="Activity" className="w-6 h-6" />
              </div>
            </div>
            
            <div className="bg-white dark:bg-slate-800/90 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-slate-200/80 dark:border-slate-700 p-5 flex items-center justify-between relative overflow-hidden hover:-translate-y-1 hover:shadow-[0_15px_35px_rgba(16,185,129,0.1)] transition-all duration-300 group">
              <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-emerald-500" />
